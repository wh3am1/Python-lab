<!DOCTYPE html>
<html>
    <head>
        <title>table</title>
    </head>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            
        }
        table, td {
            border: 1px solid #686767;
            border-radius: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            border-radius: 10px;
            background-color: #222;
            color: white;
        }
        h1 {
            text-align: center;
            font-size; large;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>

    <body>
        <h1>Users Information</h1>
        <table style="width: 50%;">
            <caption>Users Information</caption>
            <tr>
                <th style="width:33%"">Name</th>
                <th style="width: 33%">Age</th>
                <th style="width: 33%;">Country</th>
            </tr>
            <tr>
                <td>Zia  </td>
                <td> 17</td>
                <td> Afghanistan</td>
            </tr>
        </table>
    </body>
</html>
